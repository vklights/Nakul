<title>Janvi&#x27;s Memories 📸</title><style>
:root{--pink:#ff5f9e;--rose:#ff2f78;--dark:#180914;--cream:#fff7fb}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#180914,#3b102b 55%,#160811);color:#fff;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#ff5f9e22,transparent 28%),radial-gradient(circle at 80% 70%,#ffb3d522,transparent 30%);pointer-events:none}
.wrap{max-width:900px;margin:auto;padding:28px 18px 60px;position:relative;z-index:2}
.card{background:#ffffff10;border:1px solid #ffffff20;border-radius:28px;backdrop-filter:blur(12px);box-shadow:0 20px 70px #0008;padding:30px}
.center{text-align:center}.eyebrow{letter-spacing:4px;text-transform:uppercase;font-size:.72rem;opacity:.7}
h1{font-size:clamp(2.8rem,10vw,6rem);line-height:.95;margin:12px 0;background:linear-gradient(90deg,#fff,#ffb3d5,#fff);-webkit-background-clip:text;color:transparent}
h2{font-size:clamp(1.8rem,6vw,3rem);margin:8px 0 18px}
p{line-height:1.75;color:#ffeaf3}.btn{display:inline-block;border:0;text-decoration:none;color:#fff;background:linear-gradient(90deg,var(--pink),var(--rose));padding:14px 24px;border-radius:999px;font-weight:700;box-shadow:0 10px 30px #ff2f7850;cursor:pointer}
.btn.alt{background:#ffffff14;border:1px solid #ffffff25}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.heart{position:fixed;bottom:-30px;font-size:20px;animation:float 7s linear infinite;opacity:.7;z-index:1}
@keyframes float{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.hero{min-height:80vh;display:grid;place-items:center}.cake{font-size:5rem;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:20px;display:block;box-shadow:0 12px 30px #0006;transition:.35s}
.gallery img:hover{transform:scale(1.02)}
.note{font-family:"Segoe Print","Bradley Hand",cursive;font-size:1.02rem;line-height:1.85;background:#fff8fc;color:#4b1930;border-radius:22px;padding:25px;box-shadow:0 18px 45px #0007}
.note p{color:#4b1930}.signature{text-align:right;font-weight:700;color:#c72c68}
.spark{position:fixed;width:5px;height:5px;border-radius:50%;background:#fff;animation:spark 1.8s ease-out forwards;pointer-events:none}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@media(max-width:560px){.card{padding:22px}.gallery{gap:9px}.note{font-size:.96rem;padding:20px}}
